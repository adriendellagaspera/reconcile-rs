[workspace]
members = ["rsos", "rbsr", "lww-register", "gossip", "devkit", "."]
resolver = "2"

[package]
name = "reconcile"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A reconciliation storage service to sync a key-value map over multiple instances"
repository = "https://github.com/adriendellagaspera/reconcile-rs"
readme = "README.md"
keywords = ["reconciliation", "gossip", "replicated", "distributed", "crdt"]
categories = ["data-structures", "network-programming"]
exclude = [
    "pre-commit",
    "CONTRIBUTING.md",
    "examples/k8s/",
    "ARCHITECTURE.md",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
debug = true
overflow-checks = true

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "system"
harness = false

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "history_independent_catchup"
harness = false

[[bench]]
name = "runtime_history_independent_catchup"
harness = false

[[bench]]
name = "contention"
harness = false

[[bench]]
name = "snapshot_write_amplification"
harness = false

[features]
default = ["mac-blake3"]
mac-blake3 = ["gossip/mac-blake3"]
mac-hmac = ["gossip/mac-hmac"]
zeroize = ["gossip/zeroize"]
encryption = ["gossip/encryption"]
metrics = ["dep:metrics"]
metrics-prometheus = ["metrics", "dep:metrics-exporter-prometheus"]
# Reserved; currently no-op in gossip.
dns-hickory = ["gossip/dns-hickory"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(reconcile_internal_testing)"] }

[[example]]
name = "k8s"
path = "examples/k8s/main.rs"
required-features = ["metrics-prometheus"]

[dependencies]
arc-swap = "1.7.1"
bincode = "1.3.3"
chrono = { version = "0.4.31", features = ["serde"] }
gossip = { package = "reconcile-gossip", version = "0.5.0", path = "gossip", default-features = false }
ipnet = "2.9.0"
lww-register = { version = "0.5.0", path = "lww-register" }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.16", optional = true, default-features = false, features = ["http-listener"] }
parking_lot = "0.12.1"
rand = "0.8.5"
rbsr = { version = "0.2.1", path = "rbsr" }
rsos = { version = "0.5.0", path = "rsos" }
serde = { version = "1.0.192", features = ["derive"] }
tokio = { version = "1.33.0", features = ["net", "time", "rt", "macros", "sync"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1.40"

[dev-dependencies]
async-trait = "0.1"
clap = { version = "4.4.6", features = ["derive"] }
criterion = "0.5.1"
devkit = { path = "devkit" }
gossip = { package = "reconcile-gossip", version = "0.5.0", path = "gossip", default-features = false, features = ["netem"] }
metrics-util = { version = "0.19", default-features = false, features = ["debugging"] }
proptest = "1.11.0"
rand = "0.8.5"
socket2 = "0.5"
tempfile = "3"
tokio = { version = "1.33.0", features = ["macros", "rt-multi-thread", "io-util"] }
tracing-subscriber = "0.3.17"
