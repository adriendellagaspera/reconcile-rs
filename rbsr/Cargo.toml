[package]
name = "rbsr"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Range-Based Set Reconciliation (Meyer, arXiv:2212.13567) over any RSOS backend"
repository = "https://github.com/adriendellagaspera/reconcile-rs"
readme = "README.md"
keywords = ["rbsr", "reconciliation", "anti-entropy", "set", "gossip"]
categories = ["algorithms", "network-programming"]

[dependencies]
rsos = { version = "0.5.0", path = "../rsos" }
serde = { version = "1.0.192", features = ["derive"] }
tracing = "0.1.40"
rand = "0.8.5"

[dev-dependencies]
proptest = "1.11.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(reconcile_internal_testing)"] }
