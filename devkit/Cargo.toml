[package]
name = "devkit"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Internal bench/measurement infrastructure shared across this workspace's own benches. Never published."
publish = false

[dependencies]
rbsr = "=0.2.2"
rsos = "=0.5.1"
bincode = "1.3.3"
rand = "0.8.5"
serde = { version = "1.0.192", features = ["derive"] }
serde_json = "1"
