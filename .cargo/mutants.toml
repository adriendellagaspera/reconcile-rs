# cargo-mutants configuration.

all_features = true
test_workspace = true
timeout_multiplier = 3.0
minimum_test_timeout = 60
copy_target = true

exclude_globs = ["benches/**", "examples/**"]

# Test-only seams, unavailable feature branches, equivalent mutants, and mutants that cannot
# terminate or be hit deterministically.
exclude_re = [
    "testing::",
    "impl Mac for HmacSha256Mac",
    "read_replica_map/membership\\.rs:71:53: replace < with <=",
    "read_replica_map/write\\.rs:219:36: replace != with ==",
    "replay/bitmap\\.rs:75:32: replace \\| with \\^",
    "replica/construct\\.rs:212:33: replace < with <=",
    "replica/repair\\.rs:116:36: replace > with >=",
]

skip_calls = ["with_capacity", "reserve"]
