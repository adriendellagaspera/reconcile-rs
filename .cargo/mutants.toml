# cargo-mutants configuration for reconcile-rs.
#
# `scripts/check-mutant-count.sh` (wired into `repo-gates` in main.yml) proves the exclusions below
# still exclude something real -- not a stale exclude_globs/exclude_re/skip_calls pattern left
# behind by a file move or rename -- by asserting `cargo mutants --list` finds strictly more
# mutants without this config than with it. It does not track or assert either count's absolute
# value: that total moves with every commit that adds or removes mutable code anywhere in the
# workspace, unrelated to whether these exclusions are still live.
#
# Two settings are NOT optional here:
#
#   all_features   — cargo-mutants builds per package. The `reconcile::testing` /
#                    `RangeAggregate::for_testing` seam the integration-test oracles need is no
#                    longer reachable through a Cargo feature at all (#330): it is gated behind
#                    `--cfg reconcile_internal_testing`, set via RUSTFLAGS by whoever invokes
#                    cargo-mutants (scripts/check-mutation-gate.sh, mutants.yml's `nightly` job),
#                    not by this config.
#
#   test_workspace — by default each mutant only runs its own package's tests.
#                    rsos/, gossip/ and lww-register/ have no tests/ directory; their
#                    real oracles are tests/proptest_fingerprint_tree_map/ and
#                    tests/service/ in the root package. Without this, the score is
#                    measured against the wrong suite and flatters those crates.

all_features   = true
test_workspace = true

# netem/service tests wait on real sockets; a mutant that breaks convergence can
# hang rather than fail. Timeouts count as caught.
timeout_multiplier   = 3.0
minimum_test_timeout = 60

# Reuse the built target dir in each scratch copy instead of a cold build per mutant.
copy_target = true

exclude_globs = ["benches/**", "examples/**"]

# `testing::` accessors exist only under `--cfg reconcile_internal_testing` (#330): they are test
# seams, not behaviour. Mutating them yields MISSED results that are noise, not gaps.
#
# There is no blanket `impl Debug`/`impl Display` exclusion here — one used to exist, matching
# almost nothing (this codebase writes `impl fmt::Debug for X`, not the bare `impl Debug for X`
# the regex needed) and hiding, in the one site it did match
# (`rsos::encoding::error::Error::fmt`), a mutant already caught by
# `a_refusing_serialize_impl_surfaces_as_an_error`'s `.to_string().contains(...)` assertion —
# verified directly (`cargo mutants ... --no-config --re "19:9: replace.*Display.*fmt"` reports
# `caught`). Removed rather than kept: `check-mutant-count.sh`'s aggregate delta cannot catch a
# near-useless exclusion pattern on its own, only total exclusion death, so this needed reading
# each pattern's actual match count directly.
#
# `aggregate::aux`'s two fence checks (`key < lower_bound`, `key > upper_bound`) decide whether
# a subtree's cached Aggregate can answer a query without walking it. Their exact comparison
# operator is provably unobservable: `lower_bound`/`upper_bound`, whenever `Some`, can only ever
# have been set from a key the *same* range already classified `RangeOrdering::Inside` one level
# up, so the fast path can only ever wrongly fire when the *other* bound's (correctly-computed)
# check is already false, and the `&&` above never lets that combination through. Verified
# empirically, not just by proof: instrumented every recursive decision across two independent
# property tests (dense and gapped key sets, 20000+ fast-path-eligible calls total) and found
# zero cases where a flipped/loosened/tightened operator changed which subtree got returned.
# #427.
#
# The patterns below each mutate a loop counter that starts at 0 (`i += 1` -> `i *= 1`, or
# the `<=`/`+` a length-bounded index/count comparison is built from) into an update that never
# advances it -- a genuine infinite loop, not a coverage gap: check-mutation-gate.sh already scores
# a TIMEOUT the same as caught (matching the "hang rather than fail" policy above), so cargo-mutants
# spending its full 300s proving what's true by construction is pure wall-clock cost for the same
# verdict it would reach in 0s if it never generated the mutant at all. #427/#452 measured six such
# sites directly: these six alone cost 6*300s = 30 of a ~120-min in-diff run on a large file-move
# split. One of the original six -- `aggregate::aux`'s sibling `rank::aux` (then a `while`-loop
# counter, `query.rs:100:38`) -- was restructured into a bounded `for i in 0..node.keys.len()` loop
# and no longer has this defect shape at all: verified directly (`cargo mutants ... --re
# "108:27: replace \+= with \*="`, the accumulator this became) reports `caught`, not `TIMEOUT`, so
# its exclude_re entry is gone -- a stale exclusion silently doing nothing, the exact failure mode
# check-mutant-count.sh's aggregate delta cannot catch on its own (it only proves *some* exclusion
# is still live, not that *every* one is).
#
# `replay/bitmap.rs:75:32` (`SlidingBitmap::advance`'s cross-word-boundary shift, `self.0[i] = lo |
# hi`): `lo = old[i-word_shift] << bit_shift` occupies exactly bit positions `[bit_shift, 63]`
# (shifting left drops any overflow past bit 63); `hi = old[i-word_shift-1] >> (64-bit_shift)`
# occupies exactly `[0, bit_shift-1]` (shifting right by `64-bit_shift` zero-fills everything
# above). For every `bit_shift` this branch runs with (it's only entered when `bit_shift != 0`,
# so `1..=63`), those two ranges partition all 64 bit positions with zero overlap -- by
# construction of the shift amounts, not by anything about `old`'s contents. `lo & hi` is
# therefore always `0` for *any* input, which makes `lo | hi` and `lo ^ hi` produce identical
# output always: replacing `|` with `^` here is a genuine equivalent mutant, unlike `|` with `&`
# at the same site (which zeroes the disjoint-bit invariant's whole point and is correctly
# caught). #427.
#
# `range.rs:28:56` is the same defect shape via *recursion* instead of a `while` loop:
# `<ItemRange as Iterator>::next` freezes `children_passed` at its current value (`x * 1 == x`)
# and falls through to `self.next()`, which never converges -- but because that's a genuine
# recursive call rather than a bounded loop, cargo-mutants' own graceful timeout doesn't reliably
# get a chance to fire first: #452 reproduced this locally with the exact CI invocation and got
# `Signalled(9)` at 131s (an external kill, well under the 300s --timeout), not a clean Timeout
# verdict. On a resource-constrained hosted runner the same spike plausibly takes down the whole
# VM rather than just the subprocess -- matching three consecutive "runner has received a shutdown
# signal" failures of `pr-diff`'s shard 0, each stopped at nearly this same mutant.
#
# `policy/params.rs:70:9` (`SplitStride::get`, replaced with a hardcoded `0`) is the same defect
# shape as `range.rs:28:56` above, but via unbounded memory growth instead of a CPU spin:
# `protocol.rs`'s SPLIT loop advances `cur_index` using this exact accessor, and its `span > 1`
# progress-law guard (`ARCHITECTURE.md` §5 invariant 13) only fires above `span == 1` -- a
# `span <= 1` SPLIT with a lying `get()` slips past that guard into the loop itself, where
# `cur_index` never advances yet every iteration still pushes a fresh `RangeAggregate` onto
# `child_ranges`: unbounded allocation, not a bounded spin, so nothing waits for cargo-mutants'
# own 300s `--timeout` to get a chance to fire before the runner's own memory limit does.
# Reproduced locally: hardcoding `SplitStride::get` to always return `0` hangs `cargo nextest run
# -p rbsr` indefinitely on `rbsr/tests/balance_under_position_map.rs` and
# `rbsr/tests/pure_deletion_is_never_falsely_skipped.rs`, each independently, with zero output
# before a 25s bound. Matches `range.rs:28:56`'s CI history exactly: three consecutive `pr-diff`
# shard-1 runs on #427's `policy.rs` split died with "the runner has received a shutdown signal"
# at nearly this same mutant. #427.
#
# `protocol.rs:321:54` (the SPLIT fan-out loop's `if short_block == Some(block) { remainder } else
# { stride }`, replaced with `!=`) is the same defect shape as `params.rs:70:9`/`range.rs:28:56`
# above, but reachable only when `remainder == 0` (the span divides evenly by the stride, e.g. the
# `m=400`/stride-25 fixture several tests already use): there, `short_block` is `None` (nothing to
# shift), and `None != Some(block)` is true for every `block`, so the mutated arm — `remainder`,
# still `0` in this case — is taken on every iteration instead of the correct `stride`. `this_stride
# == 0` makes `cur_index.cut_before(end_index, 0)` return the same index back, so `cur_index` never
# advances while the loop keeps pushing a fresh `RangeAggregate` each pass: unbounded allocation,
# not a bounded spin, exactly like the two mutants above. Reproduced locally: reintroducing this
# exact mutation hangs `cargo nextest run -p rbsr --lib protocol::` indefinitely with zero output
# before a 90s bound, and it is what a CI `pr-diff` shard's own "runner has received a shutdown
# signal" pointed at next in mutant order. No test, however thorough, can turn this hang into a
# finite assertion (the same argument the two exclusions above already make): the loop's bound is
# exactly what this mutation removes, not something a caller-side check could restore.
#
# `read_replica_map/membership.rs:72:53` (`replace < with <=` in `peers`'s -- renamed from
# `get_peers` by #30, same line -- `instant.elapsed() < PEER_EXPIRATION` retain predicate) differs
# from every mutant above: it is not equivalent (the two operators genuinely disagree, for one
# instant, at the exact expiration boundary) and not a hang -- it is provably untestable without
# flakiness. `peers` stores real `std::time::Instant`s with no clock-injection seam (unlike
# `lww-register`'s `Hlc`/`AdmittedTime`, ARCHITECTURE.md §4), so hitting `elapsed() ==
# PEER_EXPIRATION` exactly would need either that seam (out of scope for #427's pure structural
# split) or a real-time race between computing the target `Instant` and the `retain` closure
# evaluating it -- exactly the "do not add a test that binds a fixed port"-style non-determinism
# `.claude/rules/tests.md` rules out, just for a clock instead of a port.
# `peers_drops_expired_entries_but_keeps_fresh_ones` (added for #479, renamed from
# `get_peers_drops_expired_entries_but_keeps_fresh_ones` by #30) proves the real property -- stale
# peers are dropped, fresh ones kept -- with margins wide enough to survive scheduling jitter; it
# cannot and is not meant to distinguish this single-instant mutant.
#
# `read_replica_map/write.rs:220:36` (`replace != with ==` in the receive loop's
# `if peer.port() != self.port { warn!(...) }`) genuinely is equivalent, unlike the two entries
# above: the branch's only effect, either way, is which side of the `if` calls `warn!` -- there
# is no `continue`/`return`/state write on either arm, so message processing (size check,
# `authenticator.open`, `handle_messages`, ...) proceeds identically whichever way the condition
# falls. No test capturing log output exists in this codebase, and none should be added just to
# pin an operator that gates nothing but which log line fires.
#
# `replica/construct.rs:204:33` (`replace < with <=` in `build`'s bulk-send-rate clamp,
# `if rate > 0 && rate < MIN_BULK_SEND_RATE { warn!(...); MIN_BULK_SEND_RATE } else { rate }`)
# is equivalent at exactly this one operator: `<` and `<=` disagree only when `rate ==
# MIN_BULK_SEND_RATE`, and at that point clamping to the floor and leaving `rate` unclamped
# produce the identical value (the floor itself) either way -- the only difference is whether
# `warn!` fires. Every *other* mutation to this same condition (`>` flipped, `&&` to `||`, `<`
# to `==` or `>`) genuinely changes the clamped value for some input and is caught; this is the
# single boundary point where the two comparisons coincide. No test capturing log output exists
# in this codebase, and none should be added just to pin an operator that gates nothing but
# which log line fires.
#
# `protocol/rank.rs:117-118` (`BoundedRange::parse`'s
# `if start_index.get() != raw_start || end_index.get() != raw_end { let offender = ...; debug!(...) }`)
# is the same pattern: `offender` and the shadowed `size` feed only the `debug!` call, and the
# function's `Ok(BoundedRange { .. })` return is unconditional and unaffected by this branch either
# way. No test capturing log output exists in this codebase, and none should be added just to pin
# an operator that gates nothing but which log line fires.
#
# `replica/repair.rs:118:36` (`replace > with >=` in `retry_due_repairs`'s `if repair.deadline > now
# { return true; }` "not due yet" check) is the same shape as `read_replica_map/membership.rs`'s
# `PEER_EXPIRATION` entry above, not a coincidence -- both are a `std::time::Instant` compared
# against `Instant::now()` with no clock-injection seam: `>` and `>=` disagree only at the exact
# instant `deadline == now`, which a deterministic test cannot hit without the same real-time race
# `.claude/rules/tests.md` rules out for a fixed port. Every *other* mutation at this exact site (`>`
# to `==`, `>` to `<`) is a real behaviour change caught by `a_fresh_pending_repair_is_not_yet_due`:
# with a 3600s-out deadline, either flips the check to "due now" and fires an unwanted first retry
# that assertion's `attempts == 0` catches. #23.
exclude_re = [
    "testing::",
    # `HmacSha256Mac` (`gossip/src/auth/mac.rs`) is `#[cfg(all(feature = "mac-hmac", not(feature =
    # "mac-blake3")))]` — with `all_features = true` above, this gate always builds and tests with
    # both MAC features on, so `not(feature = "mac-blake3")` is false and the entire impl is
    # compiled out: it is not merely untested, it is *absent from the binary*, so no mutation to it
    # can ever change test behaviour under this gate's own build config. Pre-existing on `main`
    # (unchanged since before #427's `gossip/src/auth.rs` split): the split just made these lines
    # newly show up in `git diff` as "added" (a pure code move, scored the same as new code) and
    # surfaced a gap the gate was already structurally incapable of closing. Exercising this backend
    # for real needs `--no-default-features --features mac-hmac`, which this gate does not run.
    "impl Mac for HmacSha256Mac",
    "read_replica_map/membership\\.rs:72:53: replace < with <=",
    "read_replica_map/write\\.rs:220:36: replace != with ==",
    "fingerprint_tree_map/query\\.rs:(37|47):29:",
    "fingerprint_tree_map/query\\.rs:61:19: replace \\+= with \\*=",
    "fingerprint_tree_map/query\\.rs:70:19: replace \\+= with \\*=",
    "fingerprint_tree_map/range\\.rs:28:56: replace \\+ with \\*",
    "fingerprint_tree_map/range\\.rs:59:32: replace <= with >",
    "fingerprint_tree_map/range\\.rs:60:51: replace \\+ with \\*",
    "replay/bitmap\\.rs:75:32: replace \\| with \\^",
    "params\\.rs:70:9: replace SplitStride::get -> usize with 0",
    "protocol\\.rs:321:54: replace == with !=",
    "protocol/rank\\.rs:117:30: replace != with ==",
    "protocol/rank\\.rs:117:43: replace \\|\\| with &&",
    "protocol/rank\\.rs:117:62: replace != with ==",
    "protocol/rank\\.rs:118:49: replace != with ==",
    "replica/construct\\.rs:204:33: replace < with <=",
    "replica/repair\\.rs:118:36: replace > with >=",
]

skip_calls = ["with_capacity", "reserve"]
