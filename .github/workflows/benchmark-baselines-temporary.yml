# Temporary on-PR measurement lane for #46/#47. Deliberately scoped to its own
# addition/update, so ordinary PR edits do not rerun the expensive measurements.
# Remove this file before merging #138; retain the reusable probes in the PR.
name: temporary #46 #47 baselines

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/benchmark-baselines-temporary.yml'

permissions:
  contents: read

concurrency:
  group: temporary-baselines-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -Dwarnings

jobs:
  memory-47:
    name: "#47 / memory"
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Record runner characteristics
        run: |
          mkdir -p reports
          {
            echo "head_sha=${{ github.event.pull_request.head.sha }}"
            rustc --version
            cargo --version
            uname -a
            lscpu
            free -h
          } | tee reports/runner.txt
      - name: Node occupancy (release profile, serial and bulk construction)
        run: |
          set -o pipefail
          RECONCILE_BASELINE_SIZES=10000,100000 \
            cargo test -p rsos --release --lib node_occupancy -- --ignored --nocapture \
            2>&1 | tee reports/occupancy.log
      - name: Requested heap and retained-snapshot COW (#47)
        run: |
          set -o pipefail
          RECONCILE_BENCH_SIZES=10000,100000 \
            cargo bench --bench system -- heap_footprint --quick \
            2>&1 | tee reports/heap.log
          grep '^\[heap_footprint' reports/heap.log > reports/heap-counts.txt
      - name: Upload raw memory measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconcile-memory-47-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: warn

  persistence-46:
    name: "#46 / persistence"
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Record runner characteristics
        run: |
          mkdir -p reports
          {
            echo "head_sha=${{ github.event.pull_request.head.sha }}"
            rustc --version
            cargo --version
            uname -a
            lscpu
            free -h
          } | tee reports/runner.txt
      - name: Full-snapshot rewrite and verified recovery (#46)
        run: |
          set -o pipefail
          RECONCILE_BASELINE_SIZES=10000,100000 \
          RECONCILE_BASELINE_DELTAS=0,1,100,1000 \
          RECONCILE_BASELINE_TRIALS=3 \
            cargo bench --bench snapshot_write_amplification \
            2>&1 | tee reports/snapshot.log
          sed -n '/^n,delta,trial,/,$p' reports/snapshot.log > reports/snapshot.csv
      - name: Upload raw snapshot measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconcile-persistence-46-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: warn
