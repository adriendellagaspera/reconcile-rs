name: replay-scaling-260

on:
  pull_request:
    paths:
      - '.github/workflows/replay-scaling-260.yml'

permissions:
  contents: read

jobs:
  compare:
    if: github.head_ref == 'perf/260-lazy-replay-purge'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RECONCILE_SECURITY_ITERS: "5000"
      RECONCILE_SECURITY_PAYLOADS: "1024"
      RECONCILE_SECURITY_REPLAY_POPULATIONS: "1,128,1024,2048,4096"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: Same-runner baseline and optimized replay ingress
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout "${{ github.event.pull_request.base.sha }}"
          cargo bench --bench security_ingress | tee /tmp/replay-before.txt
          git checkout "${{ github.event.pull_request.head.sha }}"
          cargo bench --bench security_ingress | tee /tmp/replay-after.txt
          {
            echo '## security_ingress before (base)'
            echo '```'
            grep -E '^\[security-(replay|full-gate)\]' /tmp/replay-before.txt || true
            echo '```'
            echo '## security_ingress after (PR)'
            echo '```'
            grep -E '^\[security-(replay|full-gate)\]' /tmp/replay-after.txt || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-scaling-260
          path: |
            /tmp/replay-before.txt
            /tmp/replay-after.txt
