name: fix-117-ci

on:
  push:
    branches:
      - feat/53-cluster-key-rotation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/53-cluster-key-rotation
      - name: Fix stale literals, mutant exclusion and formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for path in ("src/read_replica_set/tests.rs", "src/replicated_set/tests.rs"):
              p = Path(path)
              text = p.read_text()
              old = "        cluster_key: None,\n        insecure_no_key: true,\n"
              assert text.count(old) == 1, f"{path}: Config anchor changed"
              p.write_text(text.replace(old, "        cluster_key: None,\n        also_accept_cluster_key: None,\n        insecure_no_key: true,\n", 1))

          p = Path(".cargo/mutants.toml")
          text = p.read_text()
          start_marker = "# `replica/construct.rs:208:33`"
          end_marker = "# `protocol/rank.rs:117-118`"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + text[end:]
          lines = [line for line in text.splitlines(keepends=True) if "replica/construct\\\\.rs:208:33:" not in line]
          p.write_text("".join(lines))
          PY

          cargo fmt --all
          git rm .github/workflows/fix-117-ci.yml
          git add .cargo/mutants.toml src/read_replica_set/tests.rs src/replicated_set/tests.rs \
            gossip/src/auth.rs gossip/src/auth/key.rs src/read_replica_map.rs src/replica/construct.rs \
            src/replicated_map/config.rs src/replicated_map/config/builders.rs \
            src/replicated_map/tests.rs src/replicated_map/tests/config.rs tests/cluster_key_rotation.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Fix cluster-key rotation CI fallout'
          git push origin HEAD:feat/53-cluster-key-rotation
