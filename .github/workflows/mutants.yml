name: mutants

on:
  pull_request:
  merge_group:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PROPTEST_RNG_SEED: "20260817"

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'merge_group'
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/mutants.toml'
              - '.github/workflows/mutants.yml'
              - 'scripts/check-mutation-gate.sh'

  pr-diff:
    needs: changes
    if: github.event_name == 'merge_group' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Resolve mutation-gate base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "ref=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Fingerprint effective mutation gate
        id: fingerprint
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff "${{ steps.base.outputs.ref }}..." -- '*.rs' > /tmp/mutation.diff
          {
            printf 'gate-v1\0'
            git ls-files -s -- '*.rs' '**/Cargo.toml' Cargo.lock .cargo/mutants.toml scripts/check-mutation-gate.sh
            sha256sum /tmp/mutation.diff
          } | sha256sum | awk '{print "key=" $1}' >> "$GITHUB_OUTPUT"
      - name: Restore successful mutation result
        id: reuse
        uses: actions/cache/restore@v4
        with:
          path: .mutation-gate-success
          key: mutation-gate-v1-${{ steps.fingerprint.outputs.key }}-shard-${{ matrix.shard }}
      - name: Run mutation gate
        if: steps.reuse.outputs.cache-hit != 'true'
        run: ./scripts/check-mutation-gate.sh "${{ steps.base.outputs.ref }}" "${{ matrix.shard }}/4"
      - name: Mark successful mutation result
        if: success() && steps.reuse.outputs.cache-hit != 'true'
        run: |
          mkdir -p .mutation-gate-success
          printf '%s\n' "${{ steps.fingerprint.outputs.key }}" > ".mutation-gate-success/shard-${{ matrix.shard }}"
      - name: Save successful mutation result
        if: success() && steps.reuse.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .mutation-gate-success
          key: mutation-gate-v1-${{ steps.fingerprint.outputs.key }}-shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-incremental-${{ matrix.shard }}
          path: mutants.out

  mutants-success:
    name: mutants-success
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs:
      - changes
      - pr-diff
    runs-on: ubuntu-latest
    steps:
    - name: Fail if any job failed or was cancelled
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: |
        echo "::error::one or more mutation-gate jobs failed or were cancelled"
        exit 1

  nightly:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v3
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - env:
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg reconcile_internal_testing
        run: >
          cargo mutants --workspace
          --shard ${{ matrix.shard }}/8 --sharding round-robin
          --baseline=skip --timeout 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-nightly-${{ matrix.shard }}
          path: mutants.out
