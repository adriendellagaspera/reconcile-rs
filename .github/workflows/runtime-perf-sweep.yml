name: runtime-perf-sweep

on:
  pull_request:
    paths:
      - '.github/workflows/runtime-perf-sweep.yml'
      - 'benches/security_ingress.rs'
      - 'benches/tombstone_gc_skew.rs'
      - 'Cargo.toml'

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: security-ingress-cpu
            target: security_ingress
            env: >-
              RECONCILE_SECURITY_ITERS=5000
              RECONCILE_SECURITY_PAYLOADS=64,1024,8192
              RECONCILE_SECURITY_REPLAY_POPULATIONS=1,128,1024
          - name: tombstone-gc-skew
            target: tombstone_gc_skew
            env: >-
              RECONCILE_GC_SKEW_N=20000
              RECONCILE_GC_SKEW_DELETIONS=0,100,1000,10000

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Run ${{ matrix.target }}
        shell: bash
        run: |
          set -Eeuo pipefail
          env ${{ matrix.env }} cargo bench --bench "${{ matrix.target }}" 2>&1 | tee bench.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-perf-${{ matrix.name }}
          path: bench.log
