name: membership-benchmark-temporary

on:
  pull_request:
    branches: [main]

jobs:
  membership-benchmark:
    if: github.event.pull_request.number == 227
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - name: Run membership scaling benchmark
        run: cargo bench --bench membership_scaling
