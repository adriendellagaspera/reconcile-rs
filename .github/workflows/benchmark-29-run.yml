name: benchmark-29-run

on:
  push:
    branches: ["bench/29-persistent-tree-gate"]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          mkdir -p benchmark-29-results
          {
            echo "candidate=$(git rev-parse HEAD)"
            rustc --version
            cargo --version
            uname -a
            lscpu
          } | tee benchmark-29-results/environment.txt
      - name: High-precision COW mutation lanes
        run: |
          set -euo pipefail
          cargo build --release -p devkit --bin persistent_tree_gate
          : > benchmark-29-results/cow-mutation.txt
          for retained in 0 1 8 64; do
            for rep in 1 2 3; do
              echo "rep=$rep,retained=$retained" | tee -a benchmark-29-results/cow-mutation.txt
              target/release/persistent_tree_gate mutation --n 100000 --retained "$retained" --iters 5000 \
                | tee -a benchmark-29-results/cow-mutation.txt
            done
          done
      - name: Public snapshot and read costs
        run: |
          cat > examples/benchmark_29_public_snapshot.rs <<'RS'
          use std::hint::black_box;
          use std::sync::Arc;
          use std::time::Instant;

          use reconcile::{replicated_map::Config, InMemoryNetwork, ReplicatedMap};

          fn ns_per_op(start: Instant, iters: usize) -> f64 {
              start.elapsed().as_nanos() as f64 / iters as f64
          }

          #[tokio::main]
          async fn main() {
              const N: usize = 100_000;
              const ITERS: usize = 1_000_000;
              let network = InMemoryNetwork::new();
              let transport = Arc::new(network.bind("127.0.0.1:19029".parse().unwrap()));
              let store = ReplicatedMap::<u32, u32>::new_with_transport(
                  Config::default().with_insecure_no_key(),
                  transport,
              );
              let values: Vec<_> = (0..N as u32).map(|k| (k, k.wrapping_mul(2_654_435_761))).collect();
              store.insert_bulk(&values);
              let probe = (N / 2) as u32;

              let start = Instant::now();
              for _ in 0..ITERS {
                  black_box(store.snapshot());
              }
              println!("replicated_map_snapshot,n={N},iters={ITERS},ns_per_op={:.2}", ns_per_op(start, ITERS));

              let start = Instant::now();
              for _ in 0..ITERS {
                  black_box(store.get(black_box(&probe)).map(|v| *v));
              }
              println!("replicated_map_get,n={N},iters={ITERS},ns_per_op={:.2}", ns_per_op(start, ITERS));

              let start = Instant::now();
              for _ in 0..ITERS {
                  black_box(store.get_cloned(black_box(&probe)));
              }
              println!("replicated_map_get_cloned,n={N},iters={ITERS},ns_per_op={:.2}", ns_per_op(start, ITERS));
          }
          RS
          cargo run --release --example benchmark_29_public_snapshot \
            2>&1 | tee benchmark-29-results/public-snapshot.txt
      - name: Retained-version RSS at 1M entries
        run: |
          set -euo pipefail
          cargo build --release -p devkit --bin persistent_tree_gate
          for retained in 0 1 8 64; do
            for rep in 1 2 3; do
              /usr/bin/time -v target/release/persistent_tree_gate rss-hold --n 1000000 --retained "$retained" \
                >"benchmark-29-results/rss-${retained}-rep-${rep}.txt" 2>&1
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-29-results
          path: benchmark-29-results
