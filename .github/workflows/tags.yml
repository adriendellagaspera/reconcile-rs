name: tags

on:
  push:
    tags: [ "v*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF##*/v}"
          manifest_version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="reconcile"))')
          test "$tag_version" = "$manifest_version"
      - run: cargo package --workspace

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          set -euo pipefail
          index_url() {
            local name="$1"
            case "${#name}" in
              1) echo "https://index.crates.io/1/$name" ;;
              2) echo "https://index.crates.io/2/$name" ;;
              3) echo "https://index.crates.io/3/${name:0:1}/$name" ;;
              *) echo "https://index.crates.io/${name:0:2}/${name:2:2}/$name" ;;
            esac
          }
          indexed() {
            local name="$1" version="$2"
            curl -sS --fail "$(index_url "$name")" 2>/dev/null | python3 -c \
              "import json,sys; sys.exit(0 if any(json.loads(l).get('vers') == sys.argv[1] for l in sys.stdin if l.strip()) else 1)" \
              "$version"
          }
          publish_crate() {
            local name="$1" version
            version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]==sys.argv[1]))' "$name")
            if indexed "$name" "$version"; then return 0; fi
            cargo publish -p "$name"
            for _ in $(seq 1 60); do indexed "$name" "$version" && return 0; sleep 10; done
            echo "::error::$name $version did not appear in the crates.io index" >&2
            return 1
          }
          publish_crate rsos
          publish_crate rbsr
          publish_crate lww-register
          publish_crate reconcile-gossip
          publish_crate reconcile
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF##*/}"
          gh release create "$tag" --title "$tag" --generate-notes
