name: issue-triage-semantic

on:
  workflow_run:
    workflows: ["issue-integrity"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write        # edit bodies, fix labels, open the successor issue for a half-close
  actions: read        # read the triggering run's job logs -- the input this whole job reads

jobs:
  triage:
    if: >-
      github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: "--max-turns 40"
          prompt: |
            You are doing the **semantic half** of issue triage on ${{ github.repository }} — the
            half `scripts/check-issue-triage.sh` deliberately declines to judge.

            CONTRIBUTING.md already specifies this job under "Positioning-alignment drift": a scheduled,
            non-blocking review outside CI, where real drift becomes an issue carrying the citing
            file/line and the mismatch, and **no drift produces no output**. Honour that last
            clause literally.

            The `issue-integrity` run that triggered this is
            `${{ github.event.workflow_run.id }}` (conclusion:
            `${{ github.event.workflow_run.conclusion }}`). Read the job logs of
            `open-issue-labels`, `doc-issue-claims` and `closed-issue-shas`.

            Read it even when the run passed. Rules 7 and 8 emit *notes* that do not fail the job,
            and those notes are precisely the material here — a green run is not an empty one.

            For every rule 7 hit — a closed issue with unticked boxes — decide which of two things
            it is, resting the decision on `origin/main` rather than on inference:

            - **Bookkeeping gap.** The work is verifiably delivered and nobody ticked. Verify
              *each* box against the tree — the actual file, line, symbol. Then tick it, and write
              in the edit what you verified, not which pull request you believed.
            - **Half-close.** A row nothing delivered. Do **not** tick it. Take it out of the
              checklist, say plainly it was not done here, and re-home it into a new issue linked
              both ways. That is the remedy the rule's own header prescribes.

            Rule 6 hits: verify the named blocker is genuinely discharged — read what it actually
            delivered, not merely that it closed — before proposing any label change. Rule 8 notes:
            decide whether the parent still carries work of its own.

            Then the part no command reaches: `S-parked` issues whose stated wake-up trigger has
            quietly fired; `C-`/`A-` labels that are simply wrong; doc claims about issue state
            that a regex cannot adjudicate.

            - **Never tick a box you have not verified in the tree.** Ticking unverified work
              records as done what nobody did, corrupting the record these checks exist to protect.
              In doubt, leave it and report it.
            - **Never relabel on inference.** A blocker closing does not mean the thing it blocked
              is ready. This exact error was made on #356 and had to be reverted.
            - **Never post a comment.** AGENTS.md §9: fold the outcome into a body, a title, or a
              new issue.
            - **Every issue you create satisfies `.github/labels.tsv`**: exactly one `C-`, at least
              one `A-`, exactly one `S-`.
            - **Touch nothing younger than an hour.** `TRIAGE_GRACE_MINUTES` exists because a rule
              once fired on the four-second gap between an issue being filed and being labelled.
            - **Finding nothing is a valid and expected outcome.** Do not manufacture work to look
              useful.

            Finish with what you changed and what you deliberately left, each with its evidence. A
            finding you cannot ground in the tree should be named and left untouched — naming it is
            the deliverable, resolving it is not.
