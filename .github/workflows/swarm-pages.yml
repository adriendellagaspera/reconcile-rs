name: Swarm demo

on:
  pull_request:
    paths: ['examples/swarm/**', 'examples/swarm.rs', '.github/workflows/swarm-pages.yml']
  push:
    branches: [main, demo/swarm-vertical-slice]
    paths: ['examples/swarm/**', 'examples/swarm.rs', '.github/workflows/swarm-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test examples/swarm/*.test.mjs
      - run: docker build -f examples/swarm/deploy/Dockerfile -t swarm-demo .
      - run: docker compose -f examples/swarm/deploy/compose.yaml config --quiet
        env:
          SWARM_DOMAIN: fleet.example.org
      - run: >-
          docker run --rm
          -e SWARM_DOMAIN=fleet.example.org
          -e SWARM_UI_ORIGIN=https://adriendellagaspera.github.io
          -v "$PWD/examples/swarm/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile

  pages:
    needs: validate
    if: github.event_name != 'pull_request' && vars.SWARM_API_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build static UI with the HTTPS API endpoint
        env:
          SWARM_API_URL: ${{ vars.SWARM_API_URL }}
        run: |
          mkdir -p _site
          cp examples/swarm/{index.html,app.js,knowledge.js,api.js} _site/
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { endpoint } from './examples/swarm/api.js';
          const base = process.env.SWARM_API_URL;
          endpoint('state', base, 'https://pages.example/');
          writeFileSync('_site/config.js', `export const apiBase = ${JSON.stringify(base)};\n`);
          JS
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
