name: Swarm demo

on:
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'src/**', 'gossip/**', 'examples/swarm/**', 'examples/swarm.rs', 'scripts/build-swarm-web.sh', '.github/workflows/swarm-pages.yml']
  push:
    branches: [main, demo/swarm-vertical-slice, demo/swarm-wasm]
    paths: ['Cargo.toml', 'Cargo.lock', 'src/**', 'gossip/**', 'examples/swarm/**', 'examples/swarm.rs', 'scripts/build-swarm-web.sh', '.github/workflows/swarm-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read the locked binding generator version
        id: bindings
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('Cargo.lock', 'rb') as source:
              lock = tomllib.load(source)
          version = next(p['version'] for p in lock['package'] if p['name'] == 'wasm-bindgen')
          print(f'version={version}')
          PY
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.bindings.outputs.version }}
      - run: node --test examples/swarm/*.test.mjs
      - run: cargo clippy --locked -p reconcile-swarm-web --target wasm32-unknown-unknown -- --deny warnings
      - run: ./scripts/build-swarm-web.sh
      - name: Verify real replicas and the fleet in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/swarm-browser" playwright@1.51.1
          "$RUNNER_TEMP/swarm-browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/swarm-browser/node_modules/playwright" node examples/swarm/browser/check.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/swarm-pages

  pages:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref != 'refs/heads/demo/swarm-wasm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deploy
