name: snapshot-baseline-temporary

on:
  push:
    branches:
      - bench/snapshot-full-baseline

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: Swatinem/rust-cache@v2
      - name: Run paired snapshot baseline
        env:
          RECONCILE_SNAPSHOT_SIZES: "10000,100000"
          RECONCILE_SNAPSHOT_DELTAS: "0,1,100,1000"
          RECONCILE_SNAPSHOT_CHAIN_LENGTHS: "1,8,32"
          RECONCILE_SNAPSHOT_CHAIN_DELTAS: "1,100"
          RECONCILE_SNAPSHOT_TRIALS: "1"
        run: cargo bench --bench snapshot_write_amplification
