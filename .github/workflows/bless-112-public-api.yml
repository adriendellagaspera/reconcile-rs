name: bless-112-public-api

on:
  push:
    branches: ["fix/point-read-value-ref"]

permissions:
  contents: write

jobs:
  bless:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/point-read-value-ref
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked
      - name: Bless intentional API change
        run: ./scripts/check-public-api.sh --bless
      - name: Commit snapshots
        run: |
          if git diff --quiet -- public-api; then
            echo "No public API changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-api
          git commit -m "Bless #112 public API snapshot"
          git push origin HEAD:fix/point-read-value-ref
