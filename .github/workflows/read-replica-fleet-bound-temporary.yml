name: read-replica-fleet-bound-temporary

on:
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: Swatinem/rust-cache@v2
      - name: Run read-replica fleet bound probe
        run: cargo bench --bench read_replica_fleet
        env:
          RECONCILE_READ_REPLICA_COUNTS: 1,8,9,100,1000
