name: mutation-bench-223

on:
  pull_request:
    paths:
      - '.github/workflows/mutation-bench-223.yml'

env:
  CARGO_TERM_COLOR: always
  PROPTEST_RNG_SEED: "20260817"
  RUSTFLAGS: " --cfg reconcile_internal_testing"

jobs:
  shard-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        jobs: [1, 2, 3]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Reconstruct PR 246 mutation diff
        run: |
          git fetch origin ef99bd840583ec67c4b923fcc142defb7110f95d 515bbc65cc7d62c7230a33e04c6434a5866bce67
          git diff ef99bd840583ec67c4b923fcc142defb7110f95d...515bbc65cc7d62c7230a33e04c6434a5866bce67 -- '*.rs' > /tmp/pr246.diff
          test -s /tmp/pr246.diff
      - name: Benchmark shard 0/4 with jobs=${{ matrix.jobs }}
        run: |
          cargo mutants --workspace --no-shuffle -vV \
            --in-diff /tmp/pr246.diff \
            --timeout 300 \
            --jobs "${{ matrix.jobs }}" \
            --copy-target=false \
            --shard 0/4 --sharding round-robin
          test "$(jq '.missed' mutants.out/outcomes.json)" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-bench-223-jobs-${{ matrix.jobs }}
          path: mutants.out
