# Diagnostic only: validate #438 after compilation and network isolation fixes.
name: mutation-438-final-validation

on:
  pull_request:
    paths:
      - '.github/workflows/mutation-438-final-validation.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        jobs: [1, 3]
        repeat: [1, 2, 3]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Select stable historical and neighboring mutants
        shell: bash
        run: |
          set -euo pipefail
          file=src/replica/reconciliation.rs
          budget=$(grep -nF 'let budget = send_buf.len() + TOMBSTONE_ACK_RESEND_BYTE_BUDGET;' "$file" | cut -d: -f1)
          start=$(grep -nF 'let start = (round as usize) % n;' "$file" | cut -d: -f1)
          increment=$(grep -nF 'appended += 1;' "$file" | cut -d: -f1)
          receive_size_line=$(grep -nF 'if size == recv_buf.len() {' src/replica/run.rs | cut -d: -f1)
          peer_port_line=$(grep -nF 'if peer.port() != self.port {' src/replica/run.rs | cut -d: -f1)
          test -n "$budget" && test -n "$start" && test -n "$increment"
          test -n "$receive_size_line" && test -n "$peer_port_line"

          pattern="src/replica/(reconciliation\\.rs:($budget|$start|$increment):|run\\.rs:($receive_size_line|$peer_port_line):)"
          echo "REPRO_FILTER=$pattern" >> "$GITHUB_ENV"

          unset CARGO_TARGET_DIR CARGO_BUILD_TARGET_DIR
          cargo mutants --list --workspace --all-features --re "$pattern" |
            sort | tee selected-mutants.txt
          test "$(wc -l < selected-mutants.txt)" -ge 8

      - name: Run mutation comparison
        shell: bash
        env:
          PROPTEST_RNG_SEED: "20260817"
          MUTATION_JOBS: ${{ matrix.jobs }}
          REPEAT: ${{ matrix.repeat }}
        run: |
          set -euo pipefail
          unset CARGO_TARGET_DIR CARGO_BUILD_TARGET_DIR
          export RUSTFLAGS="${RUSTFLAGS:-} --cfg reconcile_internal_testing"

          printf 'jobs=%s repeat=%s source=%s\n'             "$MUTATION_JOBS" "$REPEAT" "$(git rev-parse HEAD)" | tee repro-info.txt

          set +e
          cargo mutants --workspace --all-features --test-workspace=true             --no-shuffle --timeout 300             --re "$REPRO_FILTER"             --jobs "$MUTATION_JOBS" --copy-target=false             > cargo-mutants-console.log 2>&1
          status=$?
          set -e
          echo "cargo_mutants_exit=$status" | tee -a repro-info.txt

          test -f mutants.out/outcomes.json
          jq -e '.outcomes[0].summary == "Success"' mutants.out/outcomes.json >/dev/null
          total=$(jq -r '.total_mutants' mutants.out/outcomes.json)
          test "$total" -ge 8

          : > verdicts.txt
          for kind in caught missed timeout unviable; do
            if [ -f "mutants.out/$kind.txt" ]; then
              sed "s/^/$kind\t/" "mutants.out/$kind.txt" >> verdicts.txt
            fi
          done
          sort -o verdicts.txt verdicts.txt
          cat verdicts.txt | tee -a repro-info.txt

          if grep -R -E             'AddrInUse|Address already in use|os error 98|Resource temporarily unavailable|failed to copy|No such file or directory.*target'             mutants.out cargo-mutants-console.log; then
            echo "infrastructure failure marker found" >&2
            exit 1
          fi

          if grep -R -F "$GITHUB_WORKSPACE/target/" mutants.out; then
            echo "mutation scenario referenced the source checkout target directory" >&2
            exit 1
          fi

          grep -RhoE '/tmp/cargo-mutants-[^ ]+\.tmp/target/(debug|release)' mutants.out             | sed 's#/target/.*##' | sort -u > target-roots.txt
          cat target-roots.txt | tee -a repro-info.txt
          roots=$(wc -l < target-roots.txt)
          if [ "$MUTATION_JOBS" -eq 3 ]; then
            test "$roots" -ge 3
          else
            test "$roots" -ge 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-438-final-jobs-${{ matrix.jobs }}-repeat-${{ matrix.repeat }}
          path: |
            selected-mutants.txt
            verdicts.txt
            target-roots.txt
            repro-info.txt
            cargo-mutants-console.log
            mutants.out/
          retention-days: 14

  compare:
    needs: reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-438-final-*
          path: artifacts

      - name: Require identical sequential and parallel verdicts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t verdicts < <(find artifacts -name verdicts.txt -type f | sort)
          test "${#verdicts[@]}" -eq 6
          reference="${verdicts[0]}"
          for file in "${verdicts[@]:1}"; do
            diff -u "$reference" "$file"
          done

          mapfile -t selected < <(find artifacts -name selected-mutants.txt -type f | sort)
          test "${#selected[@]}" -eq 6
          reference="${selected[0]}"
          for file in "${selected[@]:1}"; do
            diff -u "$reference" "$file"
          done
