name: benchmark-112-point-read

on:
  push:
    branches: ["fix/point-read-value-ref"]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Environment
        run: |
          mkdir -p benchmark-112-results
          {
            echo "candidate=$(git rev-parse HEAD)"
            echo "pre_cow=0dbc656e8f7e2ed4c978a5f46bb8364c01688304"
            echo "pre_fix_cow=9b30e5f9b403659753de995a4d277930b0d25843"
            rustc --version
            cargo --version
            lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket'
          } | tee benchmark-112-results/environment.txt
      - name: Create comparison worktrees
        run: |
          git worktree add /tmp/reconcile-pre-cow 0dbc656e8f7e2ed4c978a5f46bb8364c01688304
          git worktree add /tmp/reconcile-pre-fix 9b30e5f9b403659753de995a4d277930b0d25843
      - name: Pre-COW point read
        working-directory: /tmp/reconcile-pre-cow
        env:
          RECONCILE_BENCH_SIZES: 100000
        run: |
          set -o pipefail
          cargo bench --bench system -- 'point_read/ReplicatedMap/100000' --quick --noplot \
            2>&1 | tee "$GITHUB_WORKSPACE/benchmark-112-results/pre-cow.txt"
      - name: Pre-fix COW point read
        working-directory: /tmp/reconcile-pre-fix
        env:
          RECONCILE_BENCH_SIZES: 100000
        run: |
          set -o pipefail
          cargo bench --bench system -- 'point_read/ReplicatedMap/100000' --quick --noplot \
            2>&1 | tee "$GITHUB_WORKSPACE/benchmark-112-results/pre-fix-cow.txt"
      - name: Candidate point read
        env:
          RECONCILE_BENCH_SIZES: 100000
        run: |
          set -o pipefail
          cargo bench --bench system -- 'point_read/ReplicatedMap/100000' --quick --noplot \
            2>&1 | tee benchmark-112-results/candidate.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-112-results
          path: benchmark-112-results
