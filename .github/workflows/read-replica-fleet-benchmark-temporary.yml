name: read-replica-fleet-benchmark-temporary

on:
  pull_request:
    branches: [main]

jobs:
  read-replica-fleet-benchmark:
    if: github.event.pull_request.number == 231
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - name: Run read-replica fleet benchmark
        run: cargo bench --bench read_replica_fleet
