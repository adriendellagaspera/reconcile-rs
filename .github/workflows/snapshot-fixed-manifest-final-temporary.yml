name: snapshot-fixed-manifest-final-temporary

on:
  push:
    branches:
      - bench/snapshot-fixed-manifest-final

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: Swatinem/rust-cache@v2
      - name: Run final fixed-manifest snapshot benchmark
        env:
          RECONCILE_SNAPSHOT_SIZES: "100000"
          RECONCILE_SNAPSHOT_DELTAS: "0,1,100,1000,10000,50000,100000"
          RECONCILE_SNAPSHOT_CHAIN_LENGTHS: "32,128,512"
          RECONCILE_SNAPSHOT_CHAIN_DELTAS: "1,100"
          RECONCILE_SNAPSHOT_TRIALS: "1"
        run: cargo bench --bench snapshot_write_amplification
