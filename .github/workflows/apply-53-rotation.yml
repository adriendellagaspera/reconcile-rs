//! #53: the facade-level two-key rotation window, over the real anti-entropy loop and in-memory
//! transport. `gossip::auth` separately pins the lower-level "seal primary / verify alternate"
//! rule; these tests prove `Config` wires that rule into a running `Replica`.

use std::collections::BTreeMap;
use std::net::{IpAddr, SocketAddr};
use std::sync::Arc;
use std::time::{Duration, Instant};

use gossip::auth::ClusterKey;

use crate::clock::{ManualClock, NodeId};
use crate::entry::Entry;
use crate::replica::Replica;
use crate::replicated_map::Config;
use crate::transport::InMemoryNetwork;

fn live_view(replica: &Replica<u32, u32>) -> BTreeMap<u32, u32> {
    replica
        .map
        .load_full()
        .iter()
        .filter_map(|(key, entry)| entry.value().map(|value| (*key, *value)))
        .collect()
}

fn rotating_replica(
    net: &InMemoryNetwork,
    ip: IpAddr,
    port: u16,
    node_id: u64,
    primary: ClusterKey,
    also_accept: ClusterKey,
) -> Replica<u32, u32> {
    let config = Config::default()
        .with_listen_addr(ip)
        .with_port(port)
        .with_reconcile_interval(Duration::from_millis(5))
        .with_cluster_key_rotation(primary, also_accept);
    Replica::new_with_transport(
        config,
        Arc::new(net.bind(SocketAddr::new(ip, port))),
        Arc::new(ManualClock::new(NodeId::new(node_id))),
    )
}

fn single_key_replica(
    net: &InMemoryNetwork,
    ip: IpAddr,
    port: u16,
    node_id: u64,
    key: ClusterKey,
) -> Replica<u32, u32> {
    let config = Config::default()
        .with_listen_addr(ip)
        .with_port(port)
        .with_reconcile_interval(Duration::from_millis(5))
        .with_cluster_key(key);
    Replica::new_with_transport(
        config,
        Arc::new(net.bind(SocketAddr::new(ip, port))),
        Arc::new(ManualClock::new(NodeId::new(node_id))),
    )
}

async fn wait_for(replica: &Replica<u32, u32>, expected: &[(u32, u32)]) {
    let expected: BTreeMap<_, _> = expected.iter().copied().collect();
    let deadline = Instant::now() + Duration::from_secs(2);
    while Instant::now() < deadline {
        if live_view(replica) == expected {
            return;
        }
        tokio::time::sleep(Duration::from_millis(10)).await;
    }
    panic!("replica did not converge: got {:?}, want {expected:?}", live_view(replica));
}

#[tokio::test]
async fn mixed_primary_cluster_exchanges_updates_during_rotation() {
    let net = InMemoryNetwork::new();
    let port = 4810;
    let a_ip: IpAddr = "127.0.11.1".parse().unwrap();
    let b_ip: IpAddr = "127.0.11.2".parse().unwrap();
    let old = ClusterKey::new([0x11; 32]);
    let new = ClusterKey::new([0x22; 32]);

    // Phase 2 of the documented rollout: A still seals with old and accepts new; B has switched
    // to new and accepts old. Their keyed fingerprints intentionally differ during this phase,
    // but authentication must not partition the cluster (#116 tracks the temporary re-diff cost).
    let a = rotating_replica(&net, a_ip, port, 1, old.clone(), new.clone());
    let b = rotating_replica(&net, b_ip, port, 2, new, old);
    a.peers.write().insert(b_ip, Instant::now());
    b.peers.write().insert(a_ip, Instant::now());

    a.just_insert(1, Entry::present(a.clock_now(), 10));
    let ta = tokio::spawn(a.clone().run());
    let tb = tokio::spawn(b.clone().run());
    wait_for(&b, &[(1, 10)]).await;

    b.just_insert(2, Entry::present(b.clock_now(), 20));
    wait_for(&a, &[(1, 10), (2, 20)]).await;

    ta.abort();
    tb.abort();
}

#[tokio::test]
async fn retired_key_is_rejected_after_rotation_window_closes() {
    let net = InMemoryNetwork::new();
    let port = 4811;
    let old_ip: IpAddr = "127.0.11.3".parse().unwrap();
    let new_ip: IpAddr = "127.0.11.4".parse().unwrap();
    let old = single_key_replica(&net, old_ip, port, 3, ClusterKey::new([0x33; 32]));
    let new = single_key_replica(&net, new_ip, port, 4, ClusterKey::new([0x44; 32]));
    old.peers.write().insert(new_ip, Instant::now());
    new.peers.write().insert(old_ip, Instant::now());
    old.just_insert(1, Entry::present(old.clock_now(), 10));

    let to = tokio::spawn(old.clone().run());
    let tn = tokio::spawn(new.clone().run());
    tokio::time::sleep(Duration::from_millis(200)).await;

    assert!(
        live_view(&new).is_empty(),
        "a node configured with only the new key must reject old-key datagrams"
    );
    to.abort();
    tn.abort();
}
''')

          # Operator-facing rollout. The second key is a short-lived receive window, not key history.
          readme = Path("README.md")
          text = readme.read_text()
          anchor = "The MAC primitive is selected at build time via Cargo features: `mac-blake3` (default, keyed\n"
          assert text.count(anchor) == 1
          rotation = '''### Cluster-key rotation

Rotate the shared secret with a two-key receive window; no key id or epoch is added to the wire.
`Config::with_cluster_key_rotation(primary, also_accept)` always **sends with `primary`** and accepts
both keys on receive (MAC and encrypted modes). Use three cluster-wide phases:

| phase | config on each node | rule |
|---|---|---|
| 1 — prepare | `with_cluster_key_rotation(old, new)` | deploy everywhere before any node sends with `new` |
| 2 — switch | `with_cluster_key_rotation(new, old)` | roll node-by-node; old and new senders interoperate |
| 3 — retire | `with_cluster_key(new)` | deploy everywhere; the old key is rejected again |

Keep both secrets in the same secret manager / orchestrator secret source during the window (for
example two environment variables populated from a Kubernetes Secret), never in source or an image.
The process necessarily holds both secrets in memory while phase 1/2 is active; with the `zeroize`
feature each `ClusterKey` copy is wiped on drop. Keep the overlap short: accepting two keys expands
the credential set that can authenticate a peer until phase 3 completes.

The cluster key also derives the keyed range-fingerprint lift. Phase 2 therefore temporarily mixes
fingerprint keys: data still authenticates and converges, but equal datasets on old-primary vs
new-primary nodes do not SKIP at the root and may be re-diffed/re-sent until every primary is `new`.
[#116](https://github.com/adriendellagaspera/reconcile-rs/issues/116) tracks whether that transient
amplification warrants a multi-summary design; it does not require a wire-format change for #53.

'''
          readme.write_text(text.replace(anchor, rotation + anchor, 1))
          PY
