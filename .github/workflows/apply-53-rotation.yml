name: apply-53-rotation

on:
  push:
    branches: [feat/53-cluster-key-rotation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/53-cluster-key-rotation
      - name: Apply #53
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              assert count == 1, f"{path}: expected one anchor, got {count}: {old[:80]!r}"
              p.write_text(text.replace(old, new, 1))

          # Config owns the two-key window. The existing cluster_key remains the primary key.
          replace_once(
              "src/replicated_map/config.rs",
              "    pub cluster_key: Option<ClusterKey>,\n    /// Explicit, loudly-named opt-in to run with [`cluster_key`](Self::cluster_key) unset. Default\n",
              "    pub cluster_key: Option<ClusterKey>,\n    /// A second cluster key accepted only on receive during a rolling key rotation (#53).\n    ///\n    /// [`cluster_key`](Self::cluster_key) remains the primary key: it seals every outgoing\n    /// datagram and derives the keyed RSOS fingerprint lift. This key is tried only after the\n    /// primary fails to verify/decrypt. Configure both through\n    /// [`with_cluster_key_rotation`](Self::with_cluster_key_rotation); calling\n    /// [`with_cluster_key`](Self::with_cluster_key) retires the alternate key.\n    pub also_accept_cluster_key: Option<ClusterKey>,\n    /// Explicit, loudly-named opt-in to run with [`cluster_key`](Self::cluster_key) unset. Default\n",
          )
          replace_once(
              "src/replicated_map/config.rs",
              "    /// Redacts [`cluster_key`](Self::cluster_key): prints `Some(<redacted>)`/`None`, never the\n    /// key material, so an accidental `{:?}` in a log statement cannot leak it.\n",
              "    /// Redacts both configured cluster keys: prints `Some(<redacted>)`/`None`, never key\n    /// material, so an accidental `{:?}` in a log statement cannot leak either secret.\n",
          )
          replace_once(
              "src/replicated_map/config.rs",
              "            .field(\n                \"cluster_key\",\n                &self.cluster_key.as_ref().map(|_| \"<redacted>\"),\n            )\n            .field(\"insecure_no_key\", &self.insecure_no_key)\n",
              "            .field(\n                \"cluster_key\",\n                &self.cluster_key.as_ref().map(|_| \"<redacted>\"),\n            )\n            .field(\n                \"also_accept_cluster_key\",\n                &self.also_accept_cluster_key.as_ref().map(|_| \"<redacted>\"),\n            )\n            .field(\"insecure_no_key\", &self.insecure_no_key)\n",
          )
          replace_once(
              "src/replicated_map/config.rs",
              "            cluster_key: None,\n            insecure_no_key: false,\n",
              "            cluster_key: None,\n            also_accept_cluster_key: None,\n            insecure_no_key: false,\n",
          )

          # Public builders: the rotation builder is atomic, and the ordinary builder retires any
          # alternate key so phase 3 is just with_cluster_key(new).
          replace_once(
              "src/replicated_map/config/builders.rs",
              "    pub fn with_cluster_key(mut self, key: ClusterKey) -> Self {\n        self.cluster_key = Some(key);\n        self\n    }\n\n    /// Explicit, loudly-named opt-in to run with no [`cluster_key`](Self::cluster_key) at all.\n",
              "    pub fn with_cluster_key(mut self, key: ClusterKey) -> Self {\n        self.cluster_key = Some(key);\n        self.also_accept_cluster_key = None;\n        self\n    }\n\n    /// Configure a two-key acceptance window for a rolling cluster-key rotation (#53).\n    ///\n    /// `primary` seals every outgoing datagram; `also_accept` is receive-only and is tried only\n    /// after `primary` fails verification/decryption. This changes no wire framing. Roll out the\n    /// acceptance window cluster-wide before changing which key is primary, then call\n    /// [`with_cluster_key`](Self::with_cluster_key) with the new key on every node to retire the\n    /// old one. README \"Cluster-key rotation\" gives the exact three-phase sequence.\n    #[must_use]\n    pub fn with_cluster_key_rotation(\n        mut self,\n        primary: ClusterKey,\n        also_accept: ClusterKey,\n    ) -> Self {\n        self.cluster_key = Some(primary);\n        self.also_accept_cluster_key = Some(also_accept);\n        self\n    }\n\n    /// Explicit, loudly-named opt-in to run with no [`cluster_key`](Self::cluster_key) at all.\n",
          )

          # Both replica kinds derive fingerprints from primary, but authenticate with both keys.
          replace_once(
              "src/replica/construct.rs",
              "        // `config.encrypt` can only be `true` via `Config::with_encryption`, itself gated on\n        // `reconcile`'s `encryption` feature, which unifies to `gossip/encryption` (Cargo.toml) —\n        // so this can never actually hit `EncryptionFeatureDisabled`.\n        let authenticator = auth::Authenticator::new(config.cluster_key, config.encrypt)\n            .expect(\"reconcile's encryption feature unifies to gossip/encryption\");\n",
              "        // `config.encrypt` can only be `true` via `Config::with_encryption`, itself gated on\n        // `reconcile`'s `encryption` feature, which unifies to `gossip/encryption` (Cargo.toml) —\n        // so this can never actually hit `EncryptionFeatureDisabled`. The primary key remains the\n        // fingerprint-lift key above; `also_accept_cluster_key` is receive-only (#53). During the\n        // brief rollout phase where primaries differ, equal content therefore has different range\n        // fingerprints and may be re-diffed/re-sent; #116 tracks whether that transient cost needs\n        // a deeper multi-summary design.\n        let auth_keys = config.cluster_key.clone().map(|primary| auth::Keys {\n            primary,\n            also_accept: config\n                .also_accept_cluster_key\n                .clone()\n                .into_iter()\n                .collect(),\n        });\n        let authenticator = auth::Authenticator::with_rotation(auth_keys, config.encrypt)\n            .expect(\"reconcile's encryption feature unifies to gossip/encryption\");\n",
          )
          replace_once(
              "src/read_replica_map.rs",
              "        // `config.encrypt` can only be `true` via `Config::with_encryption`, itself gated on\n        // `reconcile`'s `encryption` feature, which unifies to `gossip/encryption` (Cargo.toml) —\n        // so this can never actually hit `EncryptionFeatureDisabled`.\n        let authenticator = auth::Authenticator::new(config.cluster_key, config.encrypt)\n            .expect(\"reconcile's encryption feature unifies to gossip/encryption\");\n",
              "        // `config.encrypt` can only be `true` via `Config::with_encryption`, itself gated on\n        // `reconcile`'s `encryption` feature, which unifies to `gossip/encryption` (Cargo.toml) —\n        // so this can never actually hit `EncryptionFeatureDisabled`. As on a dated replica, the\n        // primary key above owns the fingerprint lift while the alternate is receive-only (#53).\n        let auth_keys = config.cluster_key.clone().map(|primary| auth::Keys {\n            primary,\n            also_accept: config\n                .also_accept_cluster_key\n                .clone()\n                .into_iter()\n                .collect(),\n        });\n        let authenticator = auth::Authenticator::with_rotation(auth_keys, config.encrypt)\n            .expect(\"reconcile's encryption feature unifies to gossip/encryption\");\n",
          )

          # Internal Config literals and config-focused regression tests.
          replace_once(
              "src/replicated_map/tests.rs",
              "        cluster_key: None,\n        insecure_no_key: true,\n",
              "        cluster_key: None,\n        also_accept_cluster_key: None,\n        insecure_no_key: true,\n",
          )
          replace_once(
              "src/replicated_map/tests/config.rs",
              "    let without_key = ephemeral_config();\n    let debug = format!(\"{without_key:?}\");\n",
              "    let rotating = ephemeral_config().with_cluster_key_rotation(\n        gossip::auth::ClusterKey::new([0xAB; 32]),\n        gossip::auth::ClusterKey::new([0xCD; 32]),\n    );\n    let debug = format!(\"{rotating:?}\");\n    assert_eq!(\n        debug.matches(\"<redacted>\").count(),\n        2,\n        \"both rotation secrets must be redacted: {debug}\"\n    );\n    assert!(\n        !debug.contains(\"cd, cd, cd\") && !debug.contains(\"205, 205, 205\"),\n        \"alternate key bytes must not appear in Debug output: {debug}\"\n    );\n\n    let without_key = ephemeral_config();\n    let debug = format!(\"{without_key:?}\");\n",
          )
          replace_once(
              "src/replicated_map/tests/config.rs",
              "    let cfg = Config::default().with_max_value_size(4096);\n    assert_eq!(cfg.max_value_size, Some(4096));\n}\n",
              "    let cfg = Config::default().with_max_value_size(4096);\n    assert_eq!(cfg.max_value_size, Some(4096));\n\n    let primary = gossip::auth::ClusterKey::new([0x11; 32]);\n    let alternate = gossip::auth::ClusterKey::new([0x22; 32]);\n    let primary_lift = primary.derive_lift_key();\n    let alternate_lift = alternate.derive_lift_key();\n    let cfg = Config::default().with_cluster_key_rotation(primary, alternate);\n    assert_eq!(\n        cfg.cluster_key.as_ref().unwrap().derive_lift_key(),\n        primary_lift\n    );\n    assert_eq!(\n        cfg.also_accept_cluster_key\n            .as_ref()\n            .unwrap()\n            .derive_lift_key(),\n        alternate_lift\n    );\n\n    let cfg = cfg.with_cluster_key(gossip::auth::ClusterKey::new([0x33; 32]));\n    assert!(\n        cfg.also_accept_cluster_key.is_none(),\n        \"with_cluster_key must retire the rotation key\"\n    );\n}\n",
          )
          replace_once(
              "src/replicated_map/tests/config.rs",
              "fn max_value_size_defaults_to_none() {\n    assert_eq!(Config::default().max_value_size, None);\n}\n",
              "fn max_value_size_defaults_to_none() {\n    let cfg = Config::default();\n    assert_eq!(cfg.max_value_size, None);\n    assert!(cfg.also_accept_cluster_key.is_none());\n}\n",
          )

          # End-to-end in-memory cluster coverage: bidirectional traffic during a mixed-primary
          # window, then a fresh pair proves the retired key no longer authenticates.
          replace_once(
              "src/replica/tests.rs",
              "mod keyed_fingerprint;\nmod pacing;\n",
              "mod key_rotation;\nmod keyed_fingerprint;\nmod pacing;\n",
