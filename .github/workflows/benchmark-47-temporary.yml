# One-off paired #47 experiment on the same runner. Not part of the permanent CI contract:
# remove before merging PR #140; keep durable benchmark implementations on main.
name: temporary #47 paired measurements

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/benchmark-47-temporary.yml'

permissions:
  contents: read

concurrency:
  group: paired-47-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  paired-before-after:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: -Dwarnings --cfg reconcile_internal_testing
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: before
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: after
      - name: Install deterministic operation probe in both checkouts
        shell: bash
        run: |
          set -euo pipefail
          for variant in before after; do
            mkdir -p "$variant/rsos/examples"
            cat > "$variant/rsos/examples/issue47_probe.rs" <<'RS'
          use rsos::FingerprintTreeMap;
          use std::hint::black_box;
          use std::time::Instant;

          const N: u32 = 100_000;
          const OPS: u32 = 20_000;
          const REPS: usize = 5;

          fn key(i: u32) -> u32 {
              i.wrapping_mul(7_919).wrapping_add(104_729) % N
          }

          fn median(mut samples: Vec<u128>) -> u128 {
              samples.sort_unstable();
              samples[samples.len() / 2]
          }

          fn report(name: &str, samples: Vec<u128>, ops: u32) {
              let total = median(samples);
              println!(
                  "[issue47_probe] {name}: median_total_ns={total}, ops={ops}, ns_per_op={:.2}",
                  total as f64 / ops as f64
              );
          }

          fn main() {
              let items: Vec<(u32, u32)> = (0..N).map(|k| (k, k)).collect();

              let mut fill = Vec::with_capacity(REPS);
              for _ in 0..REPS {
                  let start = Instant::now();
                  let mut tree = FingerprintTreeMap::new();
                  for &(k, v) in &items {
                      tree.insert(k, v);
                  }
                  black_box(tree.aggregate(..));
                  fill.push(start.elapsed().as_nanos());
              }
              report("serial_fill", fill, N);

              let mut overwrite = Vec::with_capacity(REPS);
              for rep in 0..REPS {
                  let mut tree: FingerprintTreeMap<u32, u32> = items.iter().copied().collect();
                  let start = Instant::now();
                  for i in 0..OPS {
                      let k = key(i);
                      black_box(tree.insert(k, k ^ (rep as u32 + 1)));
                  }
                  overwrite.push(start.elapsed().as_nanos());
              }
              report("overwrite_existing", overwrite, OPS);

              let mut remove_insert = Vec::with_capacity(REPS);
              for _ in 0..REPS {
                  let mut tree: FingerprintTreeMap<u32, u32> = items.iter().copied().collect();
                  let start = Instant::now();
                  for i in 0..OPS {
                      let k = key(i);
                      let v = tree.remove(&k).expect("probe key exists");
                      tree.insert(k, v);
                  }
                  black_box(tree.aggregate(..));
                  remove_insert.push(start.elapsed().as_nanos());
              }
              report("remove_insert", remove_insert, OPS);

              let mut with_mut = Vec::with_capacity(REPS);
              for _ in 0..REPS {
                  let mut tree: FingerprintTreeMap<u32, u32> = items.iter().copied().collect();
                  let start = Instant::now();
                  for i in 0..OPS {
                      let k = key(i);
                      tree.with_mut(&k, |value| {
                          *value.expect("probe key exists") ^= 1;
                      });
                  }
                  black_box(tree.aggregate(..));
                  with_mut.push(start.elapsed().as_nanos());
              }
              report("with_mut", with_mut, OPS);

              let tree: FingerprintTreeMap<u32, u32> = items.iter().copied().collect();
              let mut partial_aggregate = Vec::with_capacity(REPS);
              for _ in 0..REPS {
                  let start = Instant::now();
                  for i in 0..OPS {
                      let lo = key(i) % (N - 1_024);
                      black_box(tree.aggregate(lo..lo + 1_024));
                  }
                  partial_aggregate.push(start.elapsed().as_nanos());
              }
              report("aggregate_1024", partial_aggregate, OPS);
          }
          RS
          done
      - name: Run baseline and cacheless candidate on the same runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            echo "before=$(git -C before rev-parse HEAD)"
            echo "after=$(git -C after rev-parse HEAD)"
            rustc --version
            cargo --version
            uname -a
            lscpu
            free -h
          } | tee reports/hardware.txt
          for variant in before after; do
            (
              cd "$variant"
              echo "=== $variant: private node layout/occupancy ==="
              RECONCILE_BASELINE_SIZES=10000,100000 \
                cargo test -p rsos --release --lib node_occupancy -- --ignored --nocapture \
                2>&1 | tee "$GITHUB_WORKSPACE/reports/${variant}-occupancy.log"

              echo "=== $variant: requested live heap + retained-snapshot COW ==="
              RECONCILE_BENCH_SIZES=10000,100000 \
                cargo bench --bench system -- heap_footprint --quick \
                2>&1 | tee "$GITHUB_WORKSPACE/reports/${variant}-heap.log"
              grep '^\[heap_footprint' "$GITHUB_WORKSPACE/reports/${variant}-heap.log" \
                > "$GITHUB_WORKSPACE/reports/${variant}-heap-counts.txt"

              echo "=== $variant: deterministic operation timings ==="
              cargo run -p rsos --release --example issue47_probe \
                2>&1 | tee "$GITHUB_WORKSPACE/reports/${variant}-timings.log"
            )
          done
      - name: Publish measured results and exact revisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconcile-47-paired-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
