name: refresh-lww-lock

on:
  push:
    branches: [externalize-lww-register-0.6]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: externalize-lww-register-0.6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo update -p lww-register --precise 0.6.0
      - name: Commit lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore: lock standalone lww-register 0.6.0"
          git push
