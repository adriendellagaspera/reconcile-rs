# Diagnostic only: do not merge this workflow.
name: mutation-438-final

on:
  pull_request:
    paths:
      - '.github/workflows/mutation-438-final.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        jobs: [1, 3]
        repeat: [1, 2, 3]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Select #438 historical and neighboring mutants
        shell: bash
        run: |
          set -euo pipefail
          file=src/replica/reconciliation.rs
          budget=$(grep -nF 'let budget = send_buf.len() + TOMBSTONE_ACK_RESEND_BYTE_BUDGET;' "$file" | cut -d: -f1)
          start=$(grep -nF 'let start = (round as usize) % n;' "$file" | cut -d: -f1)
          increment=$(grep -nF 'appended += 1;' "$file" | cut -d: -f1)
          receive_size_line=$(grep -nF 'if size == recv_buf.len() {' src/replica/run.rs | cut -d: -f1)
          peer_port_line=$(grep -nF 'if peer.port() != self.port {' src/replica/run.rs | cut -d: -f1)
          test -n "$budget" && test -n "$start" && test -n "$increment" && test -n "$receive_size_line" && test -n "$peer_port_line"
          pattern="src/replica/(reconciliation\\.rs:($budget|$start|$increment):|run\\.rs:($receive_size_line|$peer_port_line):)"
          echo "REPRO_FILTER=$pattern" >> "$GITHUB_ENV"
          echo "source_commit=$(git rev-parse HEAD)" | tee selected-mutants.txt
          echo "budget_line=$budget start_line=$start increment_line=$increment receive_size_line=$receive_size_line peer_port_line=$peer_port_line" | tee -a selected-mutants.txt
          unset CARGO_TARGET_DIR CARGO_BUILD_TARGET_DIR
          cargo mutants --list --workspace --all-features --re "$pattern" | tee -a selected-mutants.txt
          test "$(grep -c 'reconciliation.rs:' selected-mutants.txt)" -ge 3
          grep -q 'run.rs:' selected-mutants.txt
      - name: Reproduce and classify
        shell: bash
        env:
          PROPTEST_RNG_SEED: "20260817"
          MUTATION_JOBS: ${{ matrix.jobs }}
        run: |
          set -uo pipefail
          unset CARGO_TARGET_DIR CARGO_BUILD_TARGET_DIR
          export RUSTFLAGS="${RUSTFLAGS:-} --cfg reconcile_internal_testing"
          printf 'jobs=%s repeat=%s source=%s\n' "$MUTATION_JOBS" '${{ matrix.repeat }}' "$(git rev-parse HEAD)" | tee repro-info.txt
          set +e
          cargo mutants --workspace --all-features --test-workspace=true \
            --re "$REPRO_FILTER" \
            --jobs "$MUTATION_JOBS" --copy-target=false \
            > cargo-mutants-console.log 2>&1
          result=$?
          set -e
          printf 'cargo_mutants_exit=%s\n' "$result" | tee -a repro-info.txt
          cat cargo-mutants-console.log
          test -f mutants.out/outcomes.json
          jq '{caught, missed, timeout, unviable}' mutants.out/outcomes.json | tee -a repro-info.txt
          echo '--- infrastructure-error scan ---' | tee -a repro-info.txt
          if grep -R -nE 'AddrInUse|Address already in use|Worker thread failed|IO error|No such file or directory' mutants.out cargo-mutants-console.log | tee infrastructure-errors.txt; then
            echo "infrastructure_error_matches=present" | tee -a repro-info.txt
          else
            : > infrastructure-errors.txt
            echo "infrastructure_error_matches=none" | tee -a repro-info.txt
          fi
          echo '--- target paths ---' | tee -a repro-info.txt
          grep -RhoE '/[^ ]*/target/(debug|release)[^ ]*' mutants.out/log 2>/dev/null | sed 's/[":,)]*$//' | sort -u | tee target-paths.txt || true
          cat target-paths.txt | tee -a repro-info.txt
          printf 'missed=%s timeout=%s caught=%s unviable=%s\n' \
            "$(jq -r '.missed' mutants.out/outcomes.json)" \
            "$(jq -r '.timeout' mutants.out/outcomes.json)" \
            "$(jq -r '.caught' mutants.out/outcomes.json)" \
            "$(jq -r '.unviable' mutants.out/outcomes.json)" | tee -a repro-info.txt
          # Diagnostic: preserve every verdict and log even when cargo-mutants exits non-zero.
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-438-final-jobs-${{ matrix.jobs }}-repeat-${{ matrix.repeat }}
          path: |
            selected-mutants.txt
            repro-info.txt
            infrastructure-errors.txt
            target-paths.txt
            cargo-mutants-console.log
            mutants.out/
          retention-days: 14
