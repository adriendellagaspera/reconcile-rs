[package]
name = "reconcile-swarm-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"

[features]
metrics = ["reconcile/metrics", "dep:metrics-util"]

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
reconcile = { version = "0.6.0", path = "../../.." }
gossip = { package = "reconcile-gossip", version = "0.5.0", path = "../../../gossip", default-features = false, features = ["netem"] }
parking_lot = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7", default-features = false }
web-time = "1.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
metrics-util = { version = "0.19", optional = true, default-features = false, features = ["debugging"] }
