[package]
name = "lww-register"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Implementation detail of the `reconcile` crate — depend on `reconcile` instead; re-exported types carry its 1.0 stability line. The state-based LWW-Register CRDT domain: Entry/State, HLC Timestamp + Clock port, and the Persistence port."
repository = "https://github.com/adriendellagaspera/reconcile-rs"
readme = "README.md"
keywords = ["crdt", "lww", "register", "reconcile", "internal"]
categories = ["data-structures"]

[dependencies]
serde = { version = "1.0.192", features = ["derive"] }
